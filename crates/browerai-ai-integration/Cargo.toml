[package]
name = "browerai-ai-integration"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI integration for BrowerAI"

[dependencies]
browerai-core = { workspace = true }
browerai-ai-core = { workspace = true }
browerai-html-parser = { workspace = true }
browerai-css-parser = { workspace = true }
browerai-js-parser = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { workspace = true }

[features]
default = []
ai = ["ort"]
js_orchestrator = []

[dev-dependencies]
env_logger = { workspace = true }
tempfile = { workspace = true }

[dependencies.ort]
workspace = true
optional = true
