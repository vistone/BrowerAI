[package]
name = "auto-observer"
version = "0.1.0"
edition = "2021"

[dependencies]
playwright = "0.0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.0"
regex = "1.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
