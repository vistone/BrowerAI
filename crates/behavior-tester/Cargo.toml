[package]
name = "behavior-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
playwright = "0.0.20"
auto-observer = { path = "../auto-observer" }
visual-learner = { path = "../visual-learner" }
image = { version = "0.25", features = ["png"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
