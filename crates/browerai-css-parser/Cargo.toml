[package]
name = "browerai-css-parser"
version = "0.2.0"
edition = "2021"
authors = ["BrowerAI Contributors"]
license = "MIT"
description = "CSS parser for BrowerAI using cssparser"
repository = "https://github.com/vistone/BrowerAI"

[dependencies]
# Core
browerai-core = { path = "../browerai-core" }
browerai-ai-core = { path = "../browerai-ai-core", optional = true }

# CSS parsing
cssparser = "0.33"
selectors = "0.36"

# Color handling
css-color = "0.2"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[features]
default = []
ai = ["browerai-ai-core"]
onnx = ["ai", "browerai-ai-core/onnx"]
