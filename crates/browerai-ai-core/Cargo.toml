[package]
name = "browerai-ai-core"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI core for BrowerAI"

[dependencies]
browerai-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dirs = { workspace = true }

# Optional Candle runtime for GGUF / quantized LLMs (e.g., Qwen2.5-Coder-7B)
# NOTE: candle-core and candle-transformers use Git sources and cannot be published to crates.io
# For development with Candle support, build locally: cargo build --features candle
# For crates.io publication, use --no-default-features or restrict to onnx feature
candle-core = { version = "0.5", optional = true, default-features = false }
candle-transformers = { version = "0.5", optional = true }
tokenizers = { version = "0.15", optional = true }

[dependencies.ort]
workspace = true
optional = true

[features]
default = []
onnx = ["ort"]
# Legacy alias to keep cfg(feature="ai") code compiling
ai = ["onnx"]
# Enable Candle-based GGUF loading for large language models
candle = ["candle-core", "candle-transformers", "tokenizers"]

[dev-dependencies]
env_logger = { workspace = true }
tempfile = { workspace = true }
