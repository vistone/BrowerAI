[package]
name = "browerai-js-analyzer"
version = "0.2.0"
edition = "2021"
authors = ["BrowerAI Contributors"]
license = "MIT"
description = "JavaScript deep analysis layer with 7-stage pipeline for BrowerAI"
repository = "https://github.com/vistone/BrowerAI"

[dependencies]
# Core
browerai-core = { path = "../browerai-core" }
browerai-js-parser = { path = "../browerai-js-parser" }

# Analysis dependencies
petgraph = "0.6"          # Graph structures for CFG and CallGraph
fixedbitset = "0.4"       # Bit sets for dataflow analysis
indexmap = "2.0"          # Ordered map for scope analysis

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"
