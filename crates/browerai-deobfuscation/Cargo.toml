[package]
name = "browerai-deobfuscation"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "JavaScript deobfuscation utilities for BrowerAI"

[features]
default = []
ai = ["ort"]  # Enable ONNX-based inference
ml = ["neuroxide"]  # Enable Neuroxide-based inference

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lazy_static = "1.4"
log = { workspace = true }
base64 = "0.21"
ort = { workspace = true, optional = true }
neuroxide = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "deobfuscation_benchmarks"
harness = false
