[package]
name = "browerai-html-parser"
version = "0.2.0"
edition = "2021"
authors = ["BrowerAI Contributors"]
license = "MIT"
description = "HTML5 parser for BrowerAI using html5ever"
repository = "https://github.com/vistone/BrowerAI"

[dependencies]
# Core
browerai-core = { path = "../browerai-core" }
browerai-ai-core = { path = "../browerai-ai-core", optional = true }

# HTML5 parsing
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# String handling
tendril = "0.4"

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

[dev-dependencies]
# Testing
pretty_assertions = "1.4"

[features]
default = []
ai = ["browerai-ai-core"]
onnx = ["ai", "browerai-ai-core/onnx"]
