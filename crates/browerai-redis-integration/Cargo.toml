[package]
name = "browerai-redis-integration"
version = "0.2.0"
edition = "2021"
description = "Redis integration for distributed caching in BrowerAI"

[dependencies]
redis = { version = "1.0", features = ["tokio-comp", "connection-manager", "script"] }
deadpool-redis = "0.18"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
prometheus = "0.13"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4"] }

# 可选集成 MultiLayerCache 接口
browerai-multilayer-cache = { path = "../browerai-multilayer-cache", optional = true }

[features]
cache-integration = ["browerai-multilayer-cache"]

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "hash_tag_bench"
harness = false
