[package]
name = "browerai-renderer"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }

# 缓存集成
browerai-cache = { path = "../browerai-cache" }

# 针对性能
parking_lot = "0.12"
dashmap = "5.5"

[dev-dependencies]
approx = "0.5"
