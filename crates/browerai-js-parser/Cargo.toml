[package]
name = "browerai-js-parser"
version = "0.2.0"
edition = "2021"
authors = ["BrowerAI Contributors"]
license = "MIT"
description = "JavaScript parser for BrowerAI using Boa"
repository = "https://github.com/vistone/BrowerAI"

[dependencies]
# Core
browerai-core = { path = "../browerai-core" }
browerai-ai-core = { path = "../browerai-ai-core", optional = true }

# JavaScript parsing
boa_parser = "0.20"
boa_ast = "0.20"
boa_interner = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

[features]
default = []
ai = ["browerai-ai-core"]
onnx = ["ai", "browerai-ai-core/onnx"]
v8 = []
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
pretty_assertions = "1.4"
