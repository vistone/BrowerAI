apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: browerai-api-hpa
  namespace: browerai-region-b
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: browerai-api
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70