apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browerai-ingress
  namespace: browerai-region-a
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - region-a.api.example.com
    secretName: browerai-region-a-tls
  rules:
  - host: region-a.api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: browerai-api
            port:
              number: 80