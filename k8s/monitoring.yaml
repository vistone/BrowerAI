apiVersion: v1
kind: ResourceQuota
metadata:
  name: browerai-quota
  namespace: browerai
spec:
  hard:
    requests.cpu: "10"          # 最多 10 个 CPU 核心
    requests.memory: "20Gi"     # 最多 20GB 内存
    limits.cpu: "20"            # CPU 限制总和
    limits.memory: "40Gi"       # 内存限制总和
    pods: "20"                  # 最多 20 个 Pod
    persistentvolumeclaims: "5" # 最多 5 个 PVC

---
apiVersion: v1
kind: LimitRange
metadata:
  name: browerai-limits
  namespace: browerai
spec:
  limits:
    # Pod 级别限制
    - type: Pod
      max:
        cpu: "2"
        memory: "1Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "250m"
        memory: "128Mi"
    
    # 容器级别限制
    - type: Container
      max:
        cpu: "2"
        memory: "1Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "250m"
        memory: "128Mi"

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: browerai-api-monitor
  namespace: browerai
  labels:
    app: browerai-api
spec:
  selector:
    matchLabels:
      app: browerai-api
  endpoints:
    - port: http
      interval: 30s
      path: /metrics

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: browerai
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    
    rule_files:
      - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      
      - job_name: 'browerai-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - browerai
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: browerai-api
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-rules
  namespace: browerai
data:
  alert-rules.yml: |
    groups:
      - name: browerai-api
        interval: 30s
        rules:
          # 高错误率告警
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }}"
          
          # 高延迟告警
          - alert: HighLatency
            expr: histogram_quantile(0.99, http_request_duration_seconds_bucket) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency detected"
              description: "P99 latency is {{ $value }}s"
          
          # Pod 重启过频告警
          - alert: PodRestartingTooOften
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.01
            labels:
              severity: warning
            annotations:
              summary: "Pod is restarting too often"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted {{ $value }} times in 15 minutes"
          
          # 内存使用过高告警
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value | humanizePercentage }}"
          
          # CPU 使用过高告警
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value | humanizePercentage }}"
          
          # Pod 不可用告警
          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod is not ready"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready"
