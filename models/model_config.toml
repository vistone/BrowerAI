# BrowerAI Model Configuration
# 真实训练的模型配置 - 仅包含实际存在且验证过的模型文件
# 数据来源：真实NPM包 + GitHub框架代码

# ============== 核心：JavaScript 框架检测（Framework Detection） ==============
# 训练数据：17,542个真实NPM混淆代码样本（96MB）
# 源代码：25个NPM包（281MB）+ 21个GitHub框架（2.7MB）

[[models]]
name = "large_scale_model"
model_type = "FrameworkDetector"
path = "local/large_scale_model.onnx"
description = "大规模框架检测模型 - 基于17,542真实NPM混淆代码样本训练"
version = "1.0.0"
priority = 130
enabled = true
parameters = "34M"
format = "onnx"
task = "framework-detection"
training_samples = 17542
data_source = "Real NPM packages (ramda, lodash, react, vue, angular, etc.) + GitHub frameworks"
frameworks = ["React", "Vue", "Angular", "Svelte", "Next.js", "Nuxt", "Ember", "Backbone", "jQuery", "Preact", "SolidJS"]

[[models]]
name = "fast_enhanced"
model_type = "FrameworkDetector"
path = "local/fast_enhanced.onnx"
description = "快速增强框架检测器 - 基于17,710条混淆代码训练，98.49%准确率"
version = "2.0.0"
priority = 140
enabled = true
parameters = "908K"
format = "onnx"
task = "framework-detection"
training_samples = 17710
validation_accuracy = "98.49%"
data_source = "NPM packages with 3x obfuscation (Terser + UglifyJS)"
frameworks = ["React", "Vue", "Angular", "Svelte", "Ember", "Next.js", "Nuxt", "Gatsby", "Remix", "SvelteKit", "Express", "Fastify", "Koa", "NestJS", "Hapi", "Webpack", "Vite", "Rollup", "Esbuild", "Lodash", "Axios", "Ramda", "Underscore", "Other"]

[[models]]
name = "framework_detector_gpu"
model_type = "FrameworkDetector"
path = "local/framework_detector_gpu.onnx"
description = "GPU优化的框架检测器 - 训练自真实NPM包代码"
version = "1.0.0"
priority = 120
enabled = true
parameters = "9.6M"
format = "onnx"
task = "framework-detection"
training_data = "Real NPM packages"
frameworks = ["React", "Vue", "Angular", "Svelte", "Next.js", "Nuxt", "Ember", "Backbone", "jQuery"]

