events {
    worker_connections 1024;
}

http {
    upstream framework_api {
        server framework-api:5000;
    }

    # 速率限制
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # 日志
        access_log /var/log/nginx/framework-api-access.log;
        error_log /var/log/nginx/framework-api-error.log;

        # 健康检查(不限速)
        location /health {
            proxy_pass http://framework_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API端点(限速)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://framework_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 统计信息
        location /stats {
            proxy_pass http://framework_api/api/v1/stats;
            proxy_set_header Host $host;
        }
    }
}
