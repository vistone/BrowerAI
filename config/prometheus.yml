global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'framework-detection'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'framework-api'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    
  - job_name: 'system'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
