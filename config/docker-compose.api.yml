version: '3.8'

services:
  framework-api:
    build:
      context: .
      dockerfile: Dockerfile.api-server
    container_name: framework-detection-api
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models:ro
      - ./training:/app/training:ro
      - api-logs:/var/log/framework-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - api-network

  # Nginx反向代理(可选)
  nginx:
    image: nginx:alpine
    container_name: framework-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - framework-api
    restart: unless-stopped
    networks:
      - api-network

volumes:
  api-logs:

networks:
  api-network:
    driver: bridge
