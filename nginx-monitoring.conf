events {
    worker_connections 1024;
}

http {
    upstream framework_api {
        server framework-api:5000;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream grafana {
        server grafana:3000;
    }

    # 日志格式
    log_format monitoring '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

    server {
        listen 80 default_server;
        server_name _;

        access_log /var/log/nginx/monitoring-access.log monitoring;
        error_log /var/log/nginx/monitoring-error.log warn;

        # 框架检测API
        location /api/ {
            proxy_pass http://framework_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 健康检查
        location /health {
            proxy_pass http://framework_api;
        }

        # Prometheus指标
        location /metrics {
            proxy_pass http://framework_api;
        }

        # Prometheus WebUI
        location /prometheus {
            proxy_pass http://prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /prometheus;
            proxy_redirect off;
        }

        # Grafana仪表板
        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana API
        location /api/datasources {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
        }
    }
}
