name: Deploy - Kubernetes Deployment

on:
  push:
    branches: [main]
    tags: ['v*', 'release-*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  DEPLOYMENT_NAME: browerai-api-deployment
  NAMESPACE: browerai
  SERVICE_NAME: browerai-api-service

jobs:
  check-config:
    name: Check Kubernetes Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check for K8s secrets
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ] || [ -z "${{ secrets.KUBE_CONTEXT }}" ]; then
            echo "⚠️ Kubernetes deployment skipped - secrets not configured"
            echo ""
            echo "To enable Kubernetes deployment, add these secrets to your repository:"
            echo "  - KUBE_CONFIG: Base64 encoded kubeconfig file"
            echo "  - KUBE_CONTEXT: Kubernetes context name"
            echo ""
            echo "Deployment will be skipped but this does not fail the workflow."
          else
            echo "✅ Kubernetes secrets configured - deployment will proceed"
          fi

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: check-config
    if: ${{ secrets.KUBE_CONFIG != '' && secrets.KUBE_CONTEXT != '' }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config use-context ${{ secrets.KUBE_CONTEXT }}
          
          # Verify connection
          echo "Connected to cluster:"
          kubectl cluster-info
          kubectl get nodes
      
      - name: Prepare deployment
        run: |
          # Get image tag from input or use SHA
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${{ github.sha }}"
          fi
          
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          
          # Get Docker username from secrets
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
          echo "DOCKER_USER=${DOCKER_USER}" >> $GITHUB_ENV
      
      - name: Check deployment exists
        run: |
          if kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} &> /dev/null; then
            echo "✅ Deployment exists, will perform rolling update"
          else
            echo "⚠️ Deployment does not exist, creating..."
            kubectl apply -f k8s/deployment.yaml
          fi
      
      - name: Update deployment image
        run: |
          echo "Updating deployment image..."
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            browerai-api=${{ env.DOCKER_USER }}/browerai-api:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }} \
            --record
          
          echo "Image updated to: ${{ env.DOCKER_USER }}/browerai-api:${{ env.IMAGE_TAG }}"
      
      - name: Wait for rollout
        run: |
          echo "Waiting for deployment to roll out..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m
          
          echo "✅ Rollout completed successfully"
      
      - name: Verify deployment health
        run: |
          echo "Verifying deployment health..."
          
          # Check deployment status
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
          
          # Check pods
          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=browerai-api
          
          # Check service
          echo ""
          echo "Service status:"
          kubectl get svc ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }}
          
          # Check HPA status
          echo ""
          echo "HPA status:"
          kubectl get hpa -n ${{ env.NAMESPACE }}
      
      - name: Check pod logs
        if: always()
        run: |
          echo "Recent pod logs:"
          kubectl logs -n ${{ env.NAMESPACE }} -l app=browerai-api --tail=50 --timestamps=true
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Wait for service to be ready
          sleep 5
          
          # Port forward in background
          kubectl port-forward -n ${{ env.NAMESPACE }} \
            svc/${{ env.SERVICE_NAME }} 5000:5000 &
          
          sleep 3
          
          # Run health check
          curl -f http://localhost:5000/health || exit 1
          
          echo "✅ Smoke tests passed"
      
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Successful"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Deployment: ${{ env.DEPLOYMENT_NAME }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image: ${{ env.DOCKER_USER }}/browerai-api:${{ env.IMAGE_TAG }}"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Time: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Attempting to check pod status:"
          kubectl describe pods -n ${{ env.NAMESPACE }} -l app=browerai-api || true
