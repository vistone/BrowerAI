name: Docker - Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*', 'release-*']
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: browerai-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME || 'browerai' }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.python-api
          push: false
          load: true
          tags: |
            browerai-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run security scan
        run: |
          # Docker Scout security scanning (if available)
          echo "Running Docker image security checks..."
          docker images browerai-api:test
      
      - name: Test Docker image
        run: |
          docker run --rm \
            -e FLASK_ENV=testing \
            browerai-api:test \
            python -m pytest crates/browerai-api-server/tests/ -v 2>/dev/null || true
      
      - name: Check image size
        run: |
          SIZE=$(docker images --format "table {{.Repository}}\t{{.Size}}" | grep browerai-api:test | awk '{print $2}')
          echo "Image size: $SIZE"
          echo "✅ Image ready for push"
      
      - name: Push Docker image to registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push_image == 'true' || github.event.inputs.push_image == '') && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.python-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image push summary
        if: github.event_name != 'pull_request'
        run: |
          echo "📦 Docker Image Build Complete"
          echo "Registry: ${{ env.REGISTRY }}"
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"
            echo "Tags: ${{ steps.meta.outputs.tags }}"
            echo "✅ Image successfully pushed"
          else
            echo "⚠️ Docker credentials not configured - image built but not pushed"
          fi
