[workspace]
resolver = "2"
members = [
    "crates/browerai-core",
    "crates/browerai-dom",
    "crates/browerai-html-parser",
    "crates/browerai-css-parser",
    "crates/browerai-js-parser",
    "crates/browerai-js-analyzer",
    "crates/browerai-js-v8",
    "crates/browerai-ai-core",
    "crates/browerai-ai-integration",
    "crates/browerai-renderer-core",
    "crates/browerai-renderer-predictive",
    "crates/browerai-renderer",
    "crates/browerai-deobfuscation",
    "crates/browerai-intelligent-rendering",
    # "crates/browerai-integrated-pipeline",  # TODO: Needs API updates for newer browerai-js-analyzer
    "crates/browerai-learning",
    "crates/browerai-network",
    "crates/browerai-devtools",
    "crates/browerai-testing",
    "crates/browerai-plugins",
    "crates/browerai-ml",
    "crates/browerai-metrics",
    "crates/browerai-cache",
    "crates/browerai-db",
    "crates/browerai-api-server",
    "crates/browerai",
    "crates/browerai-multilayer-cache",
    "crates/browerai-redis-integration",
    "crates/browerai-persistent-layer",
]

[workspace.package]
edition = "2021"
authors = ["BrowerAI Contributors"]
license = "MIT"
repository = "https://github.com/vistone/BrowerAI"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client (use rustls instead of openssl)
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "json"], default-features = false }
url = "2.5"

# Timestamp
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Hashing
md5 = "0.7"

# Regular expressions
regex = "1.10"

# Synchronization primitives
parking_lot = "0.12"

# Directory utilities
dirs = "5.0"

# Concurrent data structures
dashmap = "5.5"

# Async utilities
futures = "0.3"

# HTML/CSS parsing
html5ever = "0.27"
markup5ever_rcdom = "0.3"
cssparser = "0.33"
selectors = "0.25"

# JavaScript parsing and execution
boa_parser = "0.20"
boa_ast = "0.20"
boa_interner = "0.20"
boa_engine = "0.20"
swc_core = "0.88"

# Neuroxide - Ultrafast PyTorch-like AI Framework in Rust (replaces tch)
neuroxide = { git = "https://github.com/DragonflyRobotics/Neuroxide.git", branch = "dev" }

# ONNX Runtime (optional, for model inference)
ort = "2.0.0-rc.10"

# Array processing for ML
ndarray = "0.17"

# Dev dependencies
tempfile = "3.8"

# Internal workspace crates
browerai-config = { version = "0.2.0", path = "crates/browerai-config" }
browerai-core = { version = "0.2.0", path = "crates/browerai-core" }
browerai-deobfuscation = { version = "0.2.0", path = "crates/browerai-deobfuscation" }
browerai-feedback = { version = "0.2.0", path = "crates/browerai-feedback" }
browerai-dom = { version = "0.2.0", path = "crates/browerai-dom" }
browerai-html-parser = { version = "0.2.0", path = "crates/browerai-html-parser" }
browerai-css-parser = { version = "0.2.0", path = "crates/browerai-css-parser" }
browerai-js-parser = { version = "0.2.0", path = "crates/browerai-js-parser" }
browerai-js-analyzer = { version = "0.2.0", path = "crates/browerai-js-analyzer" }
browerai-js-v8 = { version = "0.2.0", path = "crates/browerai-js-v8" }
browerai-ai-core = { version = "0.2.0", path = "crates/browerai-ai-core" }
browerai-ai-integration = { version = "0.2.0", path = "crates/browerai-ai-integration" }
browerai-renderer-core = { version = "0.2.0", path = "crates/browerai-renderer-core" }
browerai-renderer-predictive = { version = "0.2.0", path = "crates/browerai-renderer-predictive" }
browerai-renderer = { version = "0.2.0", path = "crates/browerai-renderer" }
browerai-intelligent-rendering = { version = "0.2.0", path = "crates/browerai-intelligent-rendering" }
browerai-integrated-pipeline = { version = "0.2.0", path = "crates/browerai-integrated-pipeline" }
browerai-learning = { version = "0.2.0", path = "crates/browerai-learning" }
browerai-ml = { version = "0.2.0", path = "crates/browerai-ml" }
browerai-network = { version = "0.2.0", path = "crates/browerai-network" }
browerai-devtools = { version = "0.2.0", path = "crates/browerai-devtools" }
browerai-testing = { version = "0.2.0", path = "crates/browerai-testing" }
browerai-plugins = { version = "0.2.0", path = "crates/browerai-plugins" }
browerai-metrics = { version = "0.2.0", path = "crates/browerai-metrics" }
website-classifier = { version = "0.2.0", path = "crates/website_classifier" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
